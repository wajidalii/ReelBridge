services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelbridge
      POSTGRES_PASSWORD: reelbridge
      POSTGRES_DB: reelbridge
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reelbridge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reelbridge
      MINIO_ROOT_PASSWORD: reelbridge123
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 reelbridge reelbridge123 &&
      mc mb -p local/reelbridge-media &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reelbridge:reelbridge@postgres:5432/reelbridge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: reelbridge-media
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -c "npm run db:migrate --workspace=@reelbridge/server && npm run dev:server"

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reelbridge:reelbridge@postgres:5432/reelbridge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: reelbridge-media
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: npm run dev:worker

volumes:
  postgres-data:
  redis-data:
  minio-data:
